spring:
  application:
    name: config-server
  profiles:
    # git: read the fyp-grading-config repository (GIT_REPO_URI, GIT_BRANCH).
    # native: read a mounted folder (CONFIG_DIR), handy for local runs of an unpushed branch.
    default: git
  cloud:
    config:
      server:
        # Config lives under /config so /{application}/{profile} can never shadow /actuator/**.
        prefix: /config
        git:
          uri: ${GIT_REPO_URI:https://github.com/FirasKhalife/fyp-grading-config.git}
          default-label: ${GIT_BRANCH:main}
          timeout: 5
          clone-on-start: true
          force-pull: true
          search-paths: '{application}'
        native:
          search-locations: file:${CONFIG_DIR:/config}/, file:${CONFIG_DIR:/config}/{application}/

server:
  port: ${PORT:8071}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      configPath: /config   # tells config clients (found through Eureka) where the prefix is

# The config server is only on the internal network (the gateway doesn't route it), and only these are exposed.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay config server"
    version: ${BUILD_VERSION:dev}
